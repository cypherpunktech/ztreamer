[workspace]
resolver = "3"
members = ["bin/ztreamerd", "crates/backend", "crates/blocking", "crates/chain", "crates/daemon", "crates/embedded", "crates/import", "crates/index", "crates/jsonrpc", "crates/p2p", "crates/protocol", "crates/remote", "crates/replicator", "crates/service", "crates/snapshot", "crates/sync"]

[workspace.package]
edition = "2024"
repository = "https://github.com/cypherpunktech/ztreamer"

[workspace.lints.rust]
rust_2018_idioms = { level = "deny", priority = -1 }
unused_must_use = "deny"
missing_copy_implementations = "warn"
missing_debug_implementations = "warn"
missing_docs = "warn"
unreachable_pub = "warn"

[workspace.lints.clippy]
missing_const_for_fn = "warn"
self_named_module_files = "deny"

[workspace.lints.rustdoc]
all = { level = "warn", priority = -1 }

[workspace.dependencies]
blake3 = "1.8.7"
ed25519-dalek = "3.0.0"
zakura-chain = { git = "https://github.com/zakura-core/zakura.git", tag = "v1.7.0" }
zakura-network = { git = "https://github.com/zakura-core/zakura.git", tag = "v1.7.0" }
zakura-rpc = { git = "https://github.com/zakura-core/zakura.git", tag = "v1.7.0" }
zakura-state = { git = "https://github.com/zakura-core/zakura.git", tag = "v1.7.0" }
zakura-test = { git = "https://github.com/zakura-core/zakura.git", tag = "v1.7.0" }
zakurad = { package = "zakura", git = "https://github.com/zakura-core/zakura.git", tag = "v1.7.0", default-features = false }
zakura-node-services = { git = "https://github.com/zakura-core/zakura.git", tag = "v1.7.0" }
# zakura's own pin of this crate. Keep it equal to the `sapling-crypto` line in zakura's
# Cargo.toml at the tag above: a second version makes `sapling_crypto::Node` in the state
# responses a different type from ours, and the workspace stops compiling.
sapling-crypto = { package = "zakura-sapling-crypto", version = "=4.0.0" }
# zakura's own pins of these crates. Keep them equal to the `incrementalmerkletree` and
# `zcash_primitives` lines in zakura's Cargo.toml at the tag above: a second version makes the
# tree node and frontier types different from the zakura-chain types, and the workspace stops
# compiling. `legacy-api` supplies `CommitmentTree::to_frontier`.
incrementalmerkletree = { version = "0.8.2", features = ["legacy-api"] }
# zakura's own pin of this crate, through `zakura-halo2-proofs` at the tag above. A second version
# makes `pallas::Base` a different type from the Orchard tree leaf, and the leaves stop compiling.
pasta_curves = { package = "zakura-pasta-curves", version = "=4.0.0" }
zcash_primitives = { package = "zakura-primitives", version = "=4.0.0" }

[profile.ci-rust]
inherits = "dev"
strip = true
debug = false
incremental = false

# The fastest portable build, for production: `just maxperf`. Fat LTO with one codegen unit
# lets the optimizer inline across all crates, so ztreamer's own code runs faster. `panic` stays
# `unwind`: zakura-network does not compile with `abort`.
[profile.maxperf]
inherits = "release"
lto = "fat"
codegen-units = 1
