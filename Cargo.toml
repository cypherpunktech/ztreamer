[workspace]
resolver = "3"
members = ["bin/ztreamerd", "crates/indexer", "crates/node", "crates/protocol", "crates/service"]

[workspace.package]
edition = "2024"
repository = "https://github.com/Evalir/ztreamer"

[workspace.lints.rust]
rust_2018_idioms = { level = "deny", priority = -1 }
unused_must_use = "deny"
missing_copy_implementations = "warn"
missing_debug_implementations = "warn"
missing_docs = "warn"
unreachable_pub = "warn"

[workspace.lints.clippy]
missing_const_for_fn = "warn"

[workspace.lints.rustdoc]
all = { level = "warn", priority = -1 }

[workspace.dependencies]
zakura-chain = { git = "https://github.com/zakura-core/zakura.git", tag = "v1.5.1" }
zakura-network = { git = "https://github.com/zakura-core/zakura.git", tag = "v1.5.1" }
zakura-state = { git = "https://github.com/zakura-core/zakura.git", tag = "v1.5.1" }
zakura-test = { git = "https://github.com/zakura-core/zakura.git", tag = "v1.5.1" }
zakurad = { package = "zakura", git = "https://github.com/zakura-core/zakura.git", tag = "v1.5.1", default-features = false }
zakura-node-services = { git = "https://github.com/zakura-core/zakura.git", tag = "v1.5.1" }
# zakura's own pin of this crate. Keep it equal to the `sapling-crypto` line in zakura's
# Cargo.toml at the tag above: a second version makes `sapling_crypto::Node` in the state
# responses a different type from ours, and the workspace stops compiling.
sapling-crypto = { package = "zakura-sapling-crypto", version = "=2.1.0" }

[profile.ci-rust]
inherits = "dev"
strip = true
debug = false
incremental = false
