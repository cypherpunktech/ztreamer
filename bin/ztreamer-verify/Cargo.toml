[package]
name = "ztreamer-verify"
version = "0.1.0"
edition.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
clap = { version = "4.5", features = ["derive", "env"] }
ed25519-zebra.workspace = true
eyre = "0.6"
getrandom = "0.4"
http = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
ztreamer-import = { path = "../../crates/import" }
ztreamer-index = { path = "../../crates/index" }
ztreamer-remote = { path = "../../crates/remote" }
ztreamer-snapshot = { path = "../../crates/snapshot" }
