[package]
name = "ztreamerd"
version = "0.1.0"
edition.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
clap = { version = "4.5", features = ["derive"] }
ed25519-dalek.workspace = true
eyre = "0.6"
getrandom = "0.3"
http = "1"
metrics = "0.24"
metrics-exporter-prometheus = { version = "0.17.2", default-features = false, features = ["http-listener"] }
percent-encoding = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "sync", "time"] }
tonic = { version = "0.14.6", features = ["tls-ring"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
zakura-chain.workspace = true
zakura-rpc.workspace = true
zakurad = { workspace = true, features = ["indexer"] }
zeroize = "1"
ztreamer-backend = { path = "../../crates/backend" }
ztreamer-chain = { path = "../../crates/chain" }
ztreamer-embedded = { path = "../../crates/embedded" }
ztreamer-import = { path = "../../crates/import" }
ztreamer-index = { path = "../../crates/index" }
ztreamer-p2p = { path = "../../crates/p2p" }
ztreamer-protocol = { path = "../../crates/protocol" }
ztreamer-remote = { path = "../../crates/remote" }
ztreamer-replicator = { path = "../../crates/replicator" }
ztreamer-service = { path = "../../crates/service" }
ztreamer-snapshot = { path = "../../crates/snapshot" }
ztreamer-sync = { path = "../../crates/sync" }
tokio-util = "0.7"

[dev-dependencies]
hex = "0.4"
serde_json = "1"
tempfile = "3"
tokio = { version = "1", features = ["fs", "net"] }
zakura-network.workspace = true
zakura-state = { workspace = true, features = ["indexer"] }
zakura-test.workspace = true
ztreamer-chain = { path = "../../crates/chain", features = ["test-utils"] }
ztreamer-import = { path = "../../crates/import", features = ["test-utils"] }
ztreamer-index = { path = "../../crates/index", features = ["test-utils"] }
ztreamer-remote = { path = "../../crates/remote", features = ["test-utils"] }
ztreamer-snapshot = { path = "../../crates/snapshot", features = ["test-utils"] }
