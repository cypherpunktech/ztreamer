[package]
name = "ztreamerd"
version = "0.1.0"
edition.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
clap = { version = "4.5", features = ["derive"] }
eyre = "0.6"
http = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "sync", "time"] }
tonic = { version = "0.14.6", features = ["tls-ring"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
zakura-chain.workspace = true
zakura-rpc.workspace = true
zakurad = { workspace = true, features = ["indexer", "prometheus"] }
ztreamer-indexer = { path = "../../crates/indexer" }
ztreamer-protocol = { path = "../../crates/protocol" }
ztreamer-service = { path = "../../crates/service" }
ztreamer-node = { path = "../../crates/node" }
ztreamer-remote = { path = "../../crates/remote" }
tokio-util = "0.7"

[dev-dependencies]
serde_json = "1"
tempfile = "3"
zakura-network.workspace = true
zakura-state = { workspace = true, features = ["indexer"] }
zakura-test.workspace = true
ztreamer-indexer = { path = "../../crates/indexer", features = ["test-utils"] }
ztreamer-remote = { path = "../../crates/remote", features = ["test-utils"] }
