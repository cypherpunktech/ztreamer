[package]
name = "ztreamerd"
version = "0.1.0"
edition.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
clap = { version = "4.5", features = ["derive"] }
ed25519-dalek.workspace = true
eyre = "0.6"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
zakura-chain.workspace = true
zeroize = "1"
ztreamer-daemon = { path = "../../crates/daemon" }
ztreamer-index = { path = "../../crates/index" }
ztreamer-replicator = { path = "../../crates/replicator" }

[dev-dependencies]
serde_json = "1"
tempfile = "3"
ztreamer-replicator = { path = "../../crates/replicator", features = ["test-utils"] }
ztreamer-snapshot = { path = "../../crates/snapshot", features = ["test-utils"] }
