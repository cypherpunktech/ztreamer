[package]
name = "ztreamerd"
version = "0.1.0"
edition.workspace = true
repository.workspace = true

[lints]
workspace = true

[features]
# The trace export over OTLP/gRPC, for `--otlp-endpoint`.
otlp = ["ztreamer-daemon/otlp"]

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
clap = { version = "4.5", features = ["derive", "env"] }
ed25519-zebra.workspace = true
eyre = "0.6"
tracing = "0.1"
zakura-chain.workspace = true
zeroize = "1"
ztreamer-daemon = { path = "../../crates/daemon", version = "0.1.0" }
ztreamer-index = { path = "../../crates/index", version = "0.1.0" }
ztreamer-remote = { path = "../../crates/remote", version = "0.1.0" }
ztreamer-replicator = { path = "../../crates/replicator", version = "0.1.0" }
ztreamer-sync = { path = "../../crates/sync", version = "0.1.0" }

[dev-dependencies]
serde_json = "1"
tempfile = "3"
ztreamer-replicator = { path = "../../crates/replicator", features = ["test-utils"] }
ztreamer-snapshot = { path = "../../crates/snapshot", features = ["test-utils"] }
