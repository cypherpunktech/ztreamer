[package]
name = "serving-suite"
version = "0.1.0"
edition.workspace = true
repository.workspace = true
publish = false
description = "Reproducible RPC measurements against a running CompactTxStreamer server."

[lints]
workspace = true

[dependencies]
clap = { version = "4.5", features = ["derive"] }
hex = "0.4"
prost = "0.14.4"
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time"] }
tonic = "0.14.6"
ztreamer-protocol = { path = "../../crates/protocol" }

[dev-dependencies]
tempfile = "3"
ztreamer-service = { path = "../../crates/service", features = ["test-utils"] }
