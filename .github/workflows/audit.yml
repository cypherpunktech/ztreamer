name: Security audit

on:
  schedule:
    # Daily at 09:00 UTC.
    - cron: '0 9 * * *'
  push:
    branches: [master]
    paths:
      - '**/Cargo.toml'
      - 'Cargo.lock'
      - '.cargo/audit.toml'
      - '.github/workflows/audit.yml'
  pull_request:
    paths:
      - '**/Cargo.toml'
      - 'Cargo.lock'
      - '.cargo/audit.toml'
      - '.github/workflows/audit.yml'
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  checks: write

jobs:
  audit:
    name: cargo audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: rustsec/audit-check@v2.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
