name: Rust

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  fmt:
    name: Rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/master' }}
      - run: sudo apt-get update && sudo apt-get install --yes protobuf-compiler
      - run: cargo clippy --workspace --all-targets --locked --profile ci-rust -- -D warnings

  doc:
    name: Rustdoc
    runs-on: ubuntu-latest
    env:
      RUSTDOCFLAGS: -D warnings
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/master' }}
      - run: sudo apt-get update && sudo apt-get install --yes protobuf-compiler
      - run: cargo doc --workspace --no-deps --locked --profile ci-rust

  test:
    name: Nextest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/master' }}
      - uses: taiki-e/install-action@nextest
      - run: sudo apt-get update && sudo apt-get install --yes protobuf-compiler
      - run: cargo nextest run --workspace --locked --cargo-profile ci-rust

  bench:
    name: Bench
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Select benchmark smoke check
        id: changes
        env:
          # A PR checkout is a merge commit whose first parent is the current base.
          BASE_REV: ${{ github.event_name == 'pull_request' && 'HEAD^1' || github.event.before }}
        run: |
          python3 <<'PY'
          import os
          import subprocess

          # Only known documentation/site paths can skip the smoke check.
          # Unknown paths and unavailable history must still exercise benchmarks.
          documentation = {b"README.md", b"banner.png", b"benchmarks/README.md", b"wrangler.jsonc"}
          base = os.environ["BASE_REV"]
          try:
              if not base or set(base) == {"0"}:
                  raise ValueError("no previous revision")
              changed = subprocess.check_output(
                  ["git", "diff", "--no-renames", "--name-only", "-z", base, "HEAD", "--"]
              ).split(b"\0")
              run = any(path and path not in documentation and not path.startswith(b"site/") for path in changed)
          except (ValueError, subprocess.CalledProcessError):
              run = True

          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              print(f"run={str(run).lower()}", file=output)
          if not run:
              with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as summary:
                  print("Benchmark smoke check skipped: only documentation/site files changed, or no files changed.", file=summary)
          PY
      - uses: dtolnay/rust-toolchain@stable
        if: steps.changes.outputs.run == 'true'
      - uses: Swatinem/rust-cache@v2
        if: steps.changes.outputs.run == 'true'
      - run: sudo apt-get update && sudo apt-get install --yes protobuf-compiler
        if: steps.changes.outputs.run == 'true'
      - name: Benchmark smoke test
        if: steps.changes.outputs.run == 'true'
        run: >-
          cargo bench --locked --bench parser --bench codec --bench serve
          --bench grpc --bench index -- --test
