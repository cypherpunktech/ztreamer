name: Benchmarks

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]

permissions:
  contents: read

jobs:
  bench:
    name: Benchmark comparison
    if: >-
      contains(github.event.pull_request.labels.*.name, 'benchmark') &&
      (github.event.action != 'labeled' || github.event.label.name == 'benchmark')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    concurrency:
      group: benchmark-comparison-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: sudo apt-get update && sudo apt-get install --yes protobuf-compiler
      - name: Measure base and candidate
        id: measure
        run: |
          set -euo pipefail
          python3 scripts/benchmark-metadata.py . target/benchmark-provenance
          benches() {
            local targets=(--bench parser --bench codec --bench serve)
            if [[ -f crates/service/benches/grpc.rs ]]; then
              targets+=(--bench grpc)
            fi
            cargo bench --locked "${targets[@]}" -- --noplot "$@"
          }
          # The checkout is the PR merged onto the current base branch, and its first
          # parent is that base commit. pull_request.base.sha can be older: GitHub does
          # not update it for label or reopen events.
          base=$(git rev-parse HEAD^1)
          echo "base=$base" >> "$GITHUB_OUTPUT"
          if ! git cat-file -e "$base:crates/indexer/benches/parser.rs"; then
            benches
            printf '%s\n' '## Benchmark comparison unavailable' '' \
              'The base revision has no parser benchmark. Candidate measurements are in the artifact.' \
              | tee bench-comment.md >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          rm -rf target/criterion
          head=$(git rev-parse HEAD)
          trap 'git checkout --quiet "$head"' EXIT
          git checkout --quiet "$base"
          benches --save-baseline base
          git checkout --quiet "$head"
          trap - EXIT
          benches --baseline-lenient base | tee bench-pr.txt
          echo 'compared=true' >> "$GITHUB_OUTPUT"
      - name: Report comparison
        id: report
        if: steps.measure.outputs.compared == 'true'
        continue-on-error: true
        env:
          BASE_SHA: ${{ steps.measure.outputs.base }}
        run: |
          set -euo pipefail
          python3 <<'PY' | tee bench-comment.md >> "$GITHUB_STEP_SUMMARY"
          import os
          import re
          import json
          from pathlib import Path

          ansi = re.compile(r"\x1b\[[0-9;]*m")
          entries = []
          current = None
          with open("bench-pr.txt", encoding="utf-8", errors="replace") as bench:
              lines = [ansi.sub("", line.rstrip("\n")) for line in bench]

          for index, line in enumerate(lines):
              benchmark = re.match(r"^Benchmarking ([^:]+)", line)
              if benchmark:
                  current = benchmark.group(1).strip()
                  continue

              inline_result = re.match(r"^(\S.*?)\s+time:\s+", line)
              if inline_result:
                  current = inline_result.group(1).strip()
              elif line and not line[0].isspace() and "/" in line and " " not in line:
                  current = line.strip()

              stripped = line.strip()
              if not stripped.startswith("change:"):
                  continue

              time = stripped[len("change:") :].strip()
              verdict = "unknown"
              for detail in lines[index + 1 : index + 8]:
                  if detail and not detail[0].isspace():
                      break
                  detail = detail.strip()
                  if detail.startswith("time:") and not time:
                      time = detail[len("time:") :].strip()
                  elif "Performance has regressed" in detail:
                      verdict = "regressed"
                      break
                  elif "Performance has improved" in detail:
                      verdict = "improved"
                      break
                  elif "Change within noise threshold" in detail:
                      verdict = "within noise"
                      break
                  elif "No change in performance detected" in detail:
                      verdict = "no change"
                      break
              entries.append((current or "unknown", time or "n/a", verdict))

          regressions = [entry for entry in entries if entry[2] == "regressed"]
          improvements = [entry for entry in entries if entry[2] == "improved"]
          quiet = [entry for entry in entries if entry[2] in {"within noise", "no change"}]
          unknown = [entry for entry in entries if entry[2] == "unknown"]

          def table(title, rows):
              print(f"### {title}")
              print()
              if not rows:
                  print("_None._")
                  print()
                  return
              print("| Benchmark | Time change |")
              print("|---|---:|")
              for name, time, _ in rows:
                  print(f"| `{name}` | `{time}` |")
              print()

          print(f"## Criterion vs `{os.environ['BASE_SHA']}`")
          print()
          print("Advisory comparison from a GitHub hosted runner. Rerun the job if a result is surprising.")
          print()
          if entries:
              print(
                  f"Summary: **{len(regressions)} regressions**, "
                  f"**{len(improvements)} improvements**, "
                  f"{len(quiet)} within noise/no change, {len(unknown)} unclassified."
              )
              print()
              table("Regressions", regressions)
              table("Improvements", improvements)
              if unknown:
                  table("Unclassified results (inspect raw output)", unknown)
          else:
              print("Comparison unavailable: no paired timing results were recognized. See the raw artifact.")
              print()
          unpaired = []
          for path in Path("target/criterion").glob("**/new/benchmark.json"):
              if not (path.parent.parent / "base" / "estimates.json").exists():
                  unpaired.append(json.loads(path.read_text())["full_id"])
          if unpaired:
              print("### New benchmarks (no baseline)")
              print()
              for name in sorted(unpaired):
                  print(f"- `{name}`")
              print()
          if quiet:
              print(f"<details><summary>Within noise / no change ({len(quiet)})</summary>")
              print()
              table("Within noise / no change", quiet)
              print("</details>")
          PY
      - name: Report unavailable
        if: ${{ !cancelled() && steps.report.outcome == 'failure' }}
        run: |
          printf '%s\n' '## Benchmark comparison unavailable' '' \
            'Report generation failed. Inspect bench-pr.txt and the Criterion data in the benchmark-results artifact.' \
            | tee bench-comment.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: benchmark-results
          path: |
            target/criterion
            target/benchmark-provenance
            bench-pr.txt
            bench-comment.md
          retention-days: 30
      - uses: marocchino/sticky-pull-request-comment@v2
        continue-on-error: true
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && hashFiles('bench-comment.md') != ''
        with:
          header: criterion-bench
          path: bench-comment.md
