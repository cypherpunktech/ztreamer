version: 2
updates:
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      # Keep the Zakura node and crypto crates in one update PR so their shared
      # types stay compatible. A dependency joins the first matching group.
      zakura:
        patterns:
          - "zakura*"
      # Major updates stay in separate PRs for review.
      cargo-minor-patch:
        update-types:
          - "minor"
          - "patch"
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      actions-minor-patch:
        update-types:
          - "minor"
          - "patch"
