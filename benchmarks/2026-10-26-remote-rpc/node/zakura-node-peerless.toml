# Standalone zakurad v1.5.1 on the stopped ztreamer.service state, for the --remote-rpc run.
# No peers, thus the tip stays fixed during the tail and fan-out steps.
[network]
network = "Mainnet"
listen_addr = "127.0.0.1:18233"
initial_mainnet_peers = []
cache_dir = false

[state]
cache_dir = "/var/lib/ztreamer/cache"
ephemeral = false
storage_mode = "archive"

[sync]
parallel_cpu_threads = 8

[rpc]
listen_addr = "127.0.0.1:18232"
enable_cookie_auth = true
cookie_dir = "/var/tmp/ztreamer-bench/cookie"

[tracing]
use_color = false
