[package]
name = "ztreamer-service"
version = "0.1.0"
edition.workspace = true
repository.workspace = true

[lints]
workspace = true

[features]
# Shared test, benchmark and example support in `ztreamer_service::test_utils`.
test-utils = ["dep:prost", "dep:sapling-crypto", "dep:tempfile", "tokio/net", "tokio-stream/net", "ztreamer-chain/test-utils", "ztreamer-index/test-utils"]

[dependencies]
hex = "0.4"
metrics = "0.24"
prost = { version = "0.14.4", optional = true }
sapling-crypto = { workspace = true, optional = true }
tempfile = { version = "3", optional = true }
tokio = { version = "1", features = ["macros", "rt", "sync", "time"] }
tokio-stream = "0.1"
tonic = "0.14.6"
zakura-chain.workspace = true
ztreamer-backend = { path = "../backend" }
ztreamer-chain = { path = "../chain" }
ztreamer-index = { path = "../index" }
ztreamer-protocol = { path = "../protocol" }
ztreamer-sync = { path = "../sync" }

[dev-dependencies]
clap = { version = "4.5", features = ["derive"] }
criterion = { version = "0.8", features = ["async_tokio"] }
futures-util = "0.3"
metrics-util = { version = "0.20.4", default-features = false, features = ["debugging"] }
serde_json = "1"
tempfile = "3"
tokio = { version = "1", features = ["rt-multi-thread", "net"] }
tokio-stream = { version = "0.1", features = ["net"] }
zakura-rpc.workspace = true
zakura-test.workspace = true
ztreamer-chain = { path = "../chain", features = ["test-utils"] }
ztreamer-index = { path = "../index", features = ["test-utils"] }
ztreamer-remote = { path = "../remote", features = ["test-utils"] }
# Enables `test_utils` for this crate's tests, benches and examples.
ztreamer-service = { path = ".", features = ["test-utils"] }

[[bench]]
name = "serve"
harness = false

[[bench]]
name = "grpc"
harness = false
