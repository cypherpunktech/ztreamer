[package]
name = "ztreamer-service"
version = "0.1.0"
edition.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
hex = "0.4"
metrics = "0.24"
prost = "0.14.4"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt", "sync", "time"] }
tokio-stream = "0.1"
tonic = "0.14.6"
tower = { version = "0.4.13", features = ["util"] }
zakura-chain.workspace = true
zakura-network.workspace = true
zakura-state = { workspace = true, features = ["indexer"] }
zakurad.workspace = true
ztreamer-indexer = { path = "../indexer" }
ztreamer-protocol = { path = "../protocol" }
ztreamer-node = { path = "../node" }

[dev-dependencies]
clap = { version = "4.5", features = ["derive"] }
criterion = { version = "0.7", features = ["async_tokio"] }
hdrhistogram = { version = "7.6", default-features = false }
metrics-util = { version = "0.19.1", default-features = false, features = ["debugging"] }
serde_json = "1"
tempfile = "3"
tokio = { version = "1", features = ["rt-multi-thread", "net"] }
tokio-stream = { version = "0.1", features = ["net"] }
zakura-test.workspace = true

[[bench]]
name = "serve"
harness = false

[[bench]]
name = "grpc"
harness = false
