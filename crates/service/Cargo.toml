[package]
name = "ztreamer-service"
version = "0.1.0"
edition.workspace = true
repository.workspace = true

[lints]
workspace = true

[features]
# Shared test, benchmark and example support in `ztreamer_service::test_utils`.
test-utils = ["dep:tempfile", "tokio/net", "tokio-stream/net", "ztreamer-indexer/test-utils"]

[dependencies]
hex = "0.4"
metrics = "0.24"
prost = "0.14.4"
tempfile = { version = "3", optional = true }
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt", "sync", "time"] }
tokio-stream = "0.1"
tonic = "0.14.6"
tower = { version = "0.5.3", features = ["util"] }
zakura-chain.workspace = true
zakura-network.workspace = true
zakura-state = { workspace = true, features = ["indexer"] }
zakurad.workspace = true
ztreamer-indexer = { path = "../indexer" }
ztreamer-protocol = { path = "../protocol" }
ztreamer-node = { path = "../node" }

[dev-dependencies]
clap = { version = "4.5", features = ["derive"] }
criterion = { version = "0.8", features = ["async_tokio"] }
hdrhistogram = { version = "7.6", default-features = false }
metrics-util = { version = "0.20.4", default-features = false, features = ["debugging"] }
serde_json = "1"
tempfile = "3"
tokio = { version = "1", features = ["rt-multi-thread", "net"] }
tokio-stream = { version = "0.1", features = ["net"] }
zakura-test.workspace = true
ztreamer-indexer = { path = "../indexer", features = ["test-utils"] }
# Enables `test_utils` for this crate's tests, benches and examples.
ztreamer-service = { path = ".", features = ["test-utils"] }

[[bench]]
name = "serve"
harness = false

[[bench]]
name = "grpc"
harness = false
