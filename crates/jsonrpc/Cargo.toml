[package]
name = "ztreamer-jsonrpc"
version = "0.1.0"
edition.workspace = true
repository.workspace = true
description = "JSON-RPC 2.0 client over HTTP and HTTPS"

[lints]
workspace = true

[features]
# Enables `RetryPolicy::NONE` and `RpcConfig::with_retry` for mock servers in tests.
test-utils = []

[dependencies]
base64 = "0.22"
bytes = "1"
http = "1"
http-body-util = "0.1"
hyper = { version = "1", features = ["client", "http1"] }
hyper-rustls = { version = "0.27", default-features = false, features = ["http1", "ring", "tls12", "webpki-roots"] }
hyper-util = { version = "0.1", features = ["client-legacy", "http1", "tokio"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["fs", "time"] }
tracing = "0.1"
webpki-roots = "1"

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt"] }
