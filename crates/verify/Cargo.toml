[package]
name = "ztreamer-verify"
version = "0.1.0"
edition.workspace = true
repository.workspace = true
description = "Verification of imported ranges against a snapshot manifest"

[lints]
workspace = true

[dependencies]
async-trait = "0.1"
blake3 = "1"
hex = "0.4"
pasta_curves.workspace = true
sapling-crypto.workspace = true
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_with = { version = "3", features = ["hex"] }
thiserror = "2"
zakura-chain.workspace = true
zakura-rpc.workspace = true
zakura-state.workspace = true
ztreamer-indexer = { path = "../indexer" }
ztreamer-remote = { path = "../remote" }

[dev-dependencies]
criterion = "0.8"
incrementalmerkletree.workspace = true
tokio = { version = "1", features = ["macros", "rt"] }
ztreamer-indexer = { path = "../indexer", features = ["test-utils"] }
ztreamer-remote = { path = "../remote", features = ["test-utils"] }

[[bench]]
name = "epoch"
harness = false
