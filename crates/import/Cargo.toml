[package]
name = "ztreamer-import"
version = "0.1.0"
edition.workspace = true
repository.workspace = true
description = "The replica side of replication: fetch, verify and install sealed ranges"

[lints]
workspace = true

[features]
# Shared test fixtures in `ztreamer_import::test_utils`: a source index with `range_meta` rows,
# its snapshot directory, an HTTP server for that directory and a Replicator gRPC server.
test-utils = [
    "dep:chrono",
    "dep:tempfile",
    "dep:ztreamer-embedded",
    "dep:ztreamer-replicator",
    "dep:ztreamer-sync",
    "hyper/server",
    "tokio/net",
    "tokio-stream/net",
    "ztreamer-index/test-utils",
]

[dependencies]
async-trait = "0.1"
bytes = "1"
chrono = { version = "0.4", default-features = false, features = ["std"], optional = true }
ed25519-dalek.workspace = true
futures-util = "0.3"
http = "1"
http-body-util = "0.1"
hyper = { version = "1", features = ["client", "http1"] }
hyper-util = { version = "0.1", features = ["client-legacy", "http1", "tokio"] }
pasta_curves.workspace = true
rand = { version = "0.10", default-features = false, features = ["std", "std_rng"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
tempfile = { version = "3", optional = true }
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt", "sync", "time"] }
tokio-stream = "0.1"
tonic = "0.14.6"
tracing = "0.1"
zakura-chain.workspace = true
zakura-rpc.workspace = true
zakura-state.workspace = true
ztreamer-blocking = { path = "../blocking" }
ztreamer-chain = { path = "../chain" }
ztreamer-embedded = { path = "../embedded", optional = true }
ztreamer-index = { path = "../index" }
ztreamer-protocol = { path = "../protocol" }
ztreamer-remote = { path = "../remote" }
ztreamer-replicator = { path = "../replicator", optional = true }
ztreamer-snapshot = { path = "../snapshot" }
ztreamer-sync = { path = "../sync", optional = true }

[dev-dependencies]
chrono = { version = "0.4", default-features = false, features = ["std"] }
criterion = "0.8"
hex = "0.4"
hyper = { version = "1", features = ["server"] }
incrementalmerkletree.workspace = true
sapling-crypto.workspace = true
serde_json = "1"
tempfile = "3"
tokio = { version = "1", features = ["fs", "macros", "net", "rt", "rt-multi-thread", "time"] }
tokio-stream = { version = "0.1", features = ["net"] }
zakura-test.workspace = true
ztreamer-chain = { path = "../chain", features = ["test-utils"] }
ztreamer-embedded = { path = "../embedded" }
ztreamer-index = { path = "../index", features = ["test-utils"] }
ztreamer-remote = { path = "../remote", features = ["test-utils"] }
ztreamer-replicator = { path = "../replicator" }
ztreamer-service = { path = "../service", features = ["test-utils"] }
ztreamer-snapshot = { path = "../snapshot", features = ["test-utils"] }
ztreamer-sync = { path = "../sync" }

[[bench]]
name = "epoch"
harness = false

[[bench]]
name = "install"
harness = false
