[package]
name = "ztreamer-remote"
version = "0.1.0"
edition.workspace = true
repository.workspace = true
description = "JSON-RPC client for a remote zakura node"

[lints]
workspace = true

[features]
# A mock zakura node for tests, in `ztreamer_remote::test_utils`.
test-utils = ["hyper/server", "tokio/macros", "tokio/net", "tokio/rt", "tokio/sync"]

[dependencies]
base64 = "0.22"
bytes = "1"
http = "1"
http-body-util = "0.1"
hyper = { version = "1", features = ["client", "http1"] }
hyper-rustls = { version = "0.27", default-features = false, features = ["http1", "ring", "tls12", "webpki-roots"] }
hyper-util = { version = "0.1", features = ["client-legacy", "http1", "tokio"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["time"] }
tracing = "0.1"
webpki-roots = "1"
zakura-rpc.workspace = true
zakura-state.workspace = true

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "sync"] }
zakura-test.workspace = true
ztreamer-remote = { path = ".", features = ["test-utils"] }
