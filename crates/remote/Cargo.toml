[package]
name = "ztreamer-remote"
version = "0.1.0"
edition.workspace = true
repository.workspace = true
description = "Typed JSON-RPC calls to a remote zakura node"

[lints]
workspace = true

[features]
# A mock zakura node for tests, in `ztreamer_remote::test_utils`.
test-utils = [
    "dep:bytes",
    "dep:http-body-util",
    "dep:hyper",
    "dep:hyper-util",
    "dep:serde_json",
    "hyper/http1",
    "hyper/server",
    "tokio/macros",
    "tokio/net",
    "tokio/rt",
    "tokio/sync",
    "ztreamer-jsonrpc/test-utils",
]

[dependencies]
bytes = { version = "1", optional = true }
futures-util = "0.3"
http = "1"
http-body-util = { version = "0.1", optional = true }
hyper = { version = "1", optional = true }
hyper-util = { version = "0.1", features = ["tokio"], optional = true }
incrementalmerkletree.workspace = true
lru = "0.18"
percent-encoding = "2"
sapling-crypto.workspace = true
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", optional = true }
thiserror = "2"
tokio = { version = "1", features = ["rt"] }
tonic = "0.14.6"
tracing = "0.1"
zakura-chain.workspace = true
zakura-rpc.workspace = true
zakura-state.workspace = true
zcash_primitives.workspace = true
ztreamer-blocking = { path = "../blocking" }
ztreamer-backend = { path = "../backend" }
ztreamer-chain = { path = "../chain" }
ztreamer-index = { path = "../index" }
ztreamer-jsonrpc = { path = "../jsonrpc" }
ztreamer-snapshot = { path = "../snapshot" }
ztreamer-sync = { path = "../sync" }

[dev-dependencies]
base64 = "0.23"
hex = "0.4"
tempfile = "3"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "sync"] }
zakura-test.workspace = true
ztreamer-chain = { path = "../chain", features = ["test-utils"] }
ztreamer-index = { path = "../index", features = ["test-utils"] }
ztreamer-remote = { path = ".", features = ["test-utils"] }
ztreamer-service = { path = "../service", features = ["test-utils"] }
