[package]
name = "ztreamer-replicator"
version = "0.1.0"
edition.workspace = true
repository.workspace = true
description = "The source side of replication: range_meta rows, the Replicator service and snapshot export"

[lints]
workspace = true

[features]
# Shared test fixtures in `ztreamer_replicator::test_utils`: an index with `range_meta` rows.
test-utils = ["ztreamer-chain/test-utils", "ztreamer-index/test-utils", "ztreamer-snapshot/test-utils"]

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["std"] }
ed25519-dalek.workspace = true
prost = "0.14.4"
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt", "sync", "time"] }
tokio-stream = "0.1"
tokio-util = { version = "0.7", features = ["rt"] }
tonic = "0.14.6"
tracing = "0.1"
zakura-chain.workspace = true
ztreamer-backend = { path = "../backend" }
ztreamer-chain = { path = "../chain" }
ztreamer-index = { path = "../index" }
ztreamer-protocol = { path = "../protocol" }
ztreamer-snapshot = { path = "../snapshot" }
ztreamer-sync = { path = "../sync" }

[dev-dependencies]
hex = "0.4"
tempfile = "3"
tokio = { version = "1", features = ["macros", "net", "rt", "rt-multi-thread", "time"] }
tokio-stream = { version = "0.1", features = ["net"] }
ztreamer-chain = { path = "../chain", features = ["test-utils"] }
ztreamer-index = { path = "../index", features = ["test-utils"] }
ztreamer-service = { path = "../service", features = ["test-utils"] }
ztreamer-snapshot = { path = "../snapshot", features = ["test-utils"] }
