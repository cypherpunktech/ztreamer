[package]
name = "ztreamer-snapshot"
version = "0.1.0"
edition.workspace = true
repository.workspace = true
description = "The snapshot format: manifest entries, the epoch rule, the manifest and the directory layout"

[lints]
workspace = true

[features]
# Shared test fixtures in `ztreamer_snapshot::test_utils`.
test-utils = ["ztreamer-chain/test-utils"]

[dependencies]
blake3.workspace = true
ed25519-dalek.workspace = true
hex = "0.4"
sapling-crypto.workspace = true
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
serde_with = { version = "3", features = ["hex"] }
thiserror = "2"
zakura-chain.workspace = true
ztreamer-chain = { path = "../chain" }
ztreamer-protocol = { path = "../protocol" }

[dev-dependencies]
ztreamer-chain = { path = "../chain", features = ["test-utils"] }
# Enables `test_utils` for this crate's tests.
ztreamer-snapshot = { path = ".", features = ["test-utils"] }
