[package]
name = "ztreamer-embedded"
version = "0.1.0"
edition.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
sapling-crypto.workspace = true
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt", "sync"] }
tonic = "0.14.6"
tower = { version = "0.5.3", features = ["buffer", "util"] }
zakura-chain.workspace = true
zakura-node-services.workspace = true
zakura-state = { workspace = true, features = ["indexer"] }
zakurad = { workspace = true, features = ["indexer"] }
ztreamer-backend = { path = "../backend" }
ztreamer-chain = { path = "../chain" }
ztreamer-index = { path = "../index" }
ztreamer-service = { path = "../service" }
ztreamer-sync = { path = "../sync" }

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt", "time"] }
tokio-stream = "0.1"
zakura-test.workspace = true
ztreamer-protocol = { path = "../protocol" }
ztreamer-service = { path = "../service", features = ["test-utils"] }
