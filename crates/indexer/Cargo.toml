[package]
name = "ztreamer-indexer"
version = "0.1.0"
edition.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
heed = { version = "0.22.1", default-features = false }
metrics = "0.24"
prost = "0.14.4"
serde = { version = "1", features = ["derive"] }
serde-big-array = "0.5"
thiserror = "2"
tonic = "0.14.6"
tracing = "0.1"
zakura-chain.workspace = true
zakura-state = { workspace = true, features = ["indexer"] }
ztreamer-node = { path = "../node" }
ztreamer-protocol = { path = "../protocol" }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt", "sync", "time"] }
criterion = "0.8"
metrics-util = { version = "0.20.4", default-features = false, features = ["debugging"] }
tempfile = "3"
zakura-test.workspace = true

[[bench]]
name = "parser"
harness = false

[[bench]]
name = "codec"
harness = false

[[bench]]
name = "index"
harness = false
