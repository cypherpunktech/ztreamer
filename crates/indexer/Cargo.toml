[package]
name = "ztreamer-indexer"
version = "0.1.0"
edition = "2024"

[dependencies]
heed = { version = "0.22.1", default-features = false }
hex = "0.4"
metrics = "0.24"
prost = "0.14.4"
serde = { version = "1", features = ["derive"] }
serde-big-array = "0.5"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt", "sync", "time"] }
tonic = "0.14.6"
tracing = "0.1"
zakura-chain.workspace = true
zakura-state = { workspace = true, features = ["indexer"] }
ztreamer-node = { path = "../node" }
ztreamer-protocol = { path = "../protocol" }

[dev-dependencies]
criterion = "0.7"
metrics-util = { version = "0.19.1", default-features = false, features = ["debugging"] }
tempfile = "3"
tower = { version = "0.4.13", features = ["util"] }
zakura-test.workspace = true

[[bench]]
name = "parser"
harness = false

[[bench]]
name = "codec"
harness = false

[[bench]]
name = "index"
harness = false
