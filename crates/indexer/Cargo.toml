[package]
name = "ztreamer-indexer"
version = "0.1.0"
edition.workspace = true
repository.workspace = true

[lints]
workspace = true

[features]
# Shared test and benchmark fixtures in `ztreamer_indexer::test_utils`.
test-utils = ["ztreamer-chain/test-utils"]

[dependencies]
blake3.workspace = true
heed = { version = "0.22.1", default-features = false }
hex = "0.4"
metrics = "0.24"
prost = "0.14.4"
sapling-crypto.workspace = true
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt", "sync", "time"] }
tonic = "0.14.6"
tracing = "0.1"
zakura-chain.workspace = true
ztreamer-blocking = { path = "../blocking" }
ztreamer-chain = { path = "../chain" }
ztreamer-protocol = { path = "../protocol" }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt", "rt-multi-thread", "sync", "time"] }
criterion = "0.8"
metrics-util = { version = "0.20.4", default-features = false, features = ["debugging"] }
tempfile = "3"
zakura-test.workspace = true
ztreamer-chain = { path = "../chain", features = ["test-utils"] }
# Enables `test_utils` for this crate's benches.
ztreamer-indexer = { path = ".", features = ["test-utils"] }

[[bench]]
name = "index"
harness = false
