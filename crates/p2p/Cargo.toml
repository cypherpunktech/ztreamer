[package]
name = "ztreamer-p2p"
version = "0.1.0"
edition.workspace = true
repository.workspace = true
description = "The CompactTxStreamer service over the Zakura p2p network"

[lints]
workspace = true

[dependencies]
prost = "0.14.4"
tokio = { version = "1", features = ["macros", "rt"] }
tokio-stream = "0.1"
tonic = "0.14.6"
tracing = "0.1"
zakura-network.workspace = true
ztreamer-protocol = { path = "../protocol", version = "0.1.0" }
ztreamer-service = { path = "../service", version = "0.1.0" }

[dev-dependencies]
zakura-chain.workspace = true
ztreamer-chain = { path = "../chain", features = ["test-utils"] }
ztreamer-index = { path = "../index" }
ztreamer-service = { path = "../service", features = ["test-utils"] }
