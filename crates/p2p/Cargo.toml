[package]
name = "ztreamer-p2p"
version = "0.1.0"
edition.workspace = true
repository.workspace = true
description = "The CompactTxStreamer service over the Zakura p2p network"

[lints]
workspace = true

[dependencies]
prost = "0.14.4"
tokio = { version = "1", features = ["macros", "rt"] }
tokio-stream = "0.1"
tonic = "0.14.6"
zakura-network.workspace = true
ztreamer-protocol = { path = "../protocol" }
ztreamer-service = { path = "../service" }

[dev-dependencies]
zakura-chain.workspace = true
ztreamer-chain = { path = "../chain", features = ["test-utils"] }
ztreamer-indexer = { path = "../indexer" }
ztreamer-service = { path = "../service", features = ["test-utils"] }
